global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'hadoop-namenode'
    static_configs:
      - targets: ['Nodo-principal2:9870']

  - job_name: 'hadoop-datanode-1'
    static_configs:
      - targets: ['datos-12:9864']

  - job_name: 'hadoop-datanode-2'
    static_configs:
      - targets: ['datos-22:9864']
