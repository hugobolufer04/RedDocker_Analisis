services:
  Nodo-principal2:
    build: .
    image: hadoop-con-sqoop
    container_name: Nodo-principal2
    hostname: Nodo-principal2
    ports:
      - "9870:9870"
      - "8088:8088"
      - "9000:9000"
    environment:
      - CLUSTER_NAME=test
      - CORE_CONF_fs_defaultFS=hdfs://Nodo-principal2:9000
      - CORE_CONF_hadoop_http_staticuser_user=root
      - HDFS_CONF_dfs_webhdfs_enabled=true
      - HDFS_CONF_dfs_permissions_enabled=false
      - HDFS_CONF_dfs_namenode_datanode_registration_ip___hostname___check=false
    volumes:
      - namenode:/hadoop/dfs/name
    networks:
      - red-docker2

  mysql-practica2:
  # image: mysql:8.0  <-- Original (Daba error de conexión)
    image: mysql/mysql-server:8.0
    container_name: mysql-practica2
    hostname: mysql-practica2
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root1234
      - MYSQL_DATABASE=example
      - MYSQL_USER=alumne
      - MYSQL_PASSWORD=alumne1234
      - MYSQL_ROOT_HOST=%
    command:
      --local-infile=1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot1234"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
      - ./datos_electricidad_bueno.csv:/tmp/datos_electricidad_bueno.csv
    networks:
      - red-docker2

  generador-datos:
  # image: python:3.11-slim <-- Original (Daba error de conexión)
    image: hadoop-con-sqoop
    container_name: generador-datos
    depends_on:
      mysql-practica2:
        condition: service_healthy
    volumes:
      - ./generando_datos.py:/app/generando_datos.py
      - ./exportar_a_hive.py:/app/exportar_a_hive.py
    working_dir: /app
    command: bash -c "pip install pymysql -q && python generando_datos.py && tail -f /dev/null"
    networks:
      - red-docker2
    restart: "no"

  sqoop-init:
    image: hadoop-con-sqoop
    container_name: sqoop-init
    depends_on:
      - Nodo-principal2
      - datos-12
      - datos-22
      - mysql-practica2
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://Nodo-principal2:9000
    volumes:
      - ./init-scripts/sqoop-init.sh:/sqoop-init.sh
    entrypoint: ["bash", "/sqoop-init.sh"]
    networks:
      - red-docker2
    restart: "no"

  hive-init:
    image: apache/hive:4.0.0
    container_name: hive-init
    depends_on:
      - hive2
      - sqoop-init
    volumes:
      - ./init-scripts/hive-init.sh:/hive-init.sh
    entrypoint: ["bash", "/hive-init.sh"]
    networks:
      - red-docker2
    restart: "no"

  hive2:
    image: apache/hive:4.0.0
    container_name: hive2
    hostname: hive2
    ports:
      - "10000:10000"
      - "10002:10002"
    environment:
      - SERVICE_NAME=hiveserver2
    volumes:
      - hive_metastore:/opt/hive/data/derby
    networks:
      - red-docker2

  datos-12:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datos-12
    hostname: datos-12
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://Nodo-principal2:9000
    volumes:
      - datos12_hdfs:/hadoop/dfs/data
    depends_on:
      - Nodo-principal2
    networks:
      - red-docker2

  datos-22:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datos-22
    hostname: datos-22
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://Nodo-principal2:9000
    volumes:
      - datos22_hdfs:/hadoop/dfs/data
    depends_on:
      - Nodo-principal2
    networks:
      - red-docker2

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-equipo2
    hostname: prometheus-equipo2
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - red-docker2
    depends_on:
      - Nodo-principal2

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    networks:
      - red-docker2

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-equipo2
    hostname: grafana-equipo2
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - red-docker2
    depends_on:
      - prometheus

networks:
  red-docker2:
    name: red-docker2
    driver: bridge

volumes:
  namenode:
  mysql_data:
  prometheus_data:
  grafana_data:
  datos12_hdfs:
  datos22_hdfs:
  hive_metastore:
